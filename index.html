<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV Portfolio Hub - Nguyen Phan Duy Dang" />
    <title>CV Portfolio | Nguyen Phan Duy Dang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./CV_master_css/font.css" />
    <link rel="stylesheet" href="./CV_master_css/main.css" />
    <script>
      (function () {
        var t = localStorage.getItem("cv-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <header class="top-bar">
      <div class="top-bar-inner">
        <a href="#" class="brand">
          <span class="brand-icon"><i class="icon-code"></i></span>
          <span class="brand-text">Duy<span class="brand-dot">.</span>Dang</span>
        </a>
        <div class="nav-controls">
          <a href="editor.html" class="demo-back-link" data-i18n="hub_manage">Manage CVs</a>
          <div class="lang-toggle">
            <button class="lang-btn active" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="vi" type="button">VI</button>
          </div>
          <button class="btn-icon" id="theme-toggle" type="button" aria-label="Toggle theme">
            <i class="icon-moon theme-icon" id="theme-icon"></i>
          </button>
        </div>
      </div>
    </header>

    <section class="hub-header">
      <div class="hub-header-inner">
        <h1 data-i18n="hub_title">My CV Portfolio</h1>
        <p data-i18n="hub_subtitle">Select a CV to view, or open the editor to create a new one.</p>
        <a href="editor.html" class="btn-primary-custom" data-i18n="hub_new">New CV</a>
      </div>
    </section>

    <main class="section-wrap">
      <div class="cv-grid" id="cv-grid">
        <div class="cv-loading"><p>Loading…</p></div>
      </div>
    </main>

    <footer class="site-footer">
      <p class="footer-copy" data-i18n="footer_copy">© 2026 Nguyễn Phan Duy Đăng. All rights reserved.</p>
    </footer>

    <script src="CV_master_js/i18n.js"></script>
    <script src="CV_master_js/cv-paths.js"></script>
    <script src="CV_master_js/hub.js"></script>
  </body>
</html>
